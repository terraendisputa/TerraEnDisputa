# Runs only at chosen milestones, never on every push:
# - manually from the Actions tab (verification, plus packages if requested),
# - on a pull request when the `ci` label is added (verification only),
# - when a `v*` tag is pushed (verification, packages and a draft release).
name: CI

on:
  workflow_dispatch:
    inputs:
      package:
        description: Build Linux and Windows packages
        type: boolean
        default: true
  pull_request:
    types: [labeled]
  push:
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.22.2'

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - if: runner.os == 'Linux'
        run: pnpm lint
      - run: pnpm build
      - run: pnpm test:integration

  package:
    needs: verify
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.package)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:build
      - run: pnpm release:smoke
      # Desktop app installers, built from the same server package.
      - run: pnpm desktop:build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ted-${{ matrix.target }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS
            release/manifest-*.json
            release/desktop/*.AppImage
            release/desktop/*.deb
            release/desktop/*.tar.gz
            release/desktop/*.exe
            release/desktop/*.zip
            release/desktop/SHA256SUMS

  release:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed provenance for every published file (gh attestation verify).
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
      - name: Merge checksums
        run: |
          mkdir out
          cat dist/*/SHA256SUMS dist/*/desktop/SHA256SUMS | sort -k2 > out/SHA256SUMS
          cp dist/*/*.zip dist/*/*.tar.gz dist/*/manifest-*.json out/
          find dist/*/desktop -type f ! -name SHA256SUMS -exec cp {} out/ \;
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: out/*
