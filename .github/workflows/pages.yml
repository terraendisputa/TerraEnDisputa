# Publishes the project page in site/ to GitHub Pages.
# Runs only when site/ changes on main, or manually from the Actions tab.
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**']

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
